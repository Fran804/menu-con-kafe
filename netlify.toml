[build]
  command = "npm run build"
  publish = "dist/menu-con-kafe/browser"

[build.environment]
  NODE_VERSION = "22"
  CI           = "true"

# SPA fallback — app estática client-side, todas las rutas caen a index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cabeceras de seguridad globales
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Assets con hash → caché agresivo (1 año)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html — sin caché para servir siempre la versión nueva
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

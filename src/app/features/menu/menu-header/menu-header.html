<header class="header">
  <!-- Logo real dentro de un escudo crema para dar contraste sobre el verde -->
  <div class="header__crest">
    <img class="header__logo" src="images/logo-con-kafe.png"
      [attr.alt]="'Logo de ' + (config()?.name ?? 'Con KaFe')" />
  </div>

  <!-- El nombre ya aparece en el logo; se mantiene como h1 accesible (oculto visualmente) -->
  <h1 class="sr-only">{{ config()?.name ?? 'Con KaFe' }}</h1>
  <p class="header__tagline">{{ config()?.tagline ?? 'Panadería & Café' }}</p>
</header>

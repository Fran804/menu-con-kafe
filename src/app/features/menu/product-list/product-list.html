<section class="menu-section" [id]="'section-' + category().id"
  [attr.aria-labelledby]="'cat-' + category().id">
  <h2 class="section-label" [id]="'cat-' + category().id">
    <span class="section-label__text">{{ category().name }}</span>
  </h2>

  <div class="menu-section__items">
    @for (row of rows(); track row.product.id) {
      @if (row.showLabel) {
        <p class="subcategory-label" aria-hidden="true">{{ row.product.subcategory }}</p>
      }
      <app-product-item [product]="row.product" (select)="select.emit($event)" />
    } @empty {
      <p class="menu-section__empty">Pronto añadiremos productos a esta categoría.</p>
    }
  </div>
</section>

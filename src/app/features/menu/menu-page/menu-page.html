<div class="page">
  <app-menu-header />
  <app-category-navigation />

  <main class="frame">
    <div class="frame__inner">
      <p class="frame__hint">Toca un producto para ver foto, descripción y precio</p>

      @for (category of visibleCategories(); track category.id) {
        <app-product-list
          [category]="category"
          [products]="productsOf(category.id)"
          (select)="openProduct($event)" />
      }

      <app-menu-footer />
    </div>
  </main>
</div>

<app-product-modal [product]="selectedProduct()" (closed)="closeProduct()" />
